<div class="fixed-header">
	<div class="status-bar-layer"></div>
	<mat-toolbar *ngIf="getSymptoms$() | async as symptoms" class="mat-typography">
		<!-- Outlined icons, filled with a pill behind for the current page -->
		<button mat-icon-button id="menu-icon-timeline" class="nav-button" [class.active]="activeSection === 'timeline'"
			routerLink="" aria-label="Timeline">
			<mat-icon [fontSet]="activeSection === 'timeline' ? 'material-icons' : 'material-icons-outlined'">view_day
			</mat-icon>
		</button>
		<button mat-icon-button id="menu-icon-calendar" class="nav-button menu-icon"
			[class.active]="activeSection === 'calendar'" routerLink="/calendar" aria-label="Calendar">
			<mat-icon [fontSet]="activeSection === 'calendar' ? 'material-icons' : 'material-icons-outlined'">
				calendar_month</mat-icon>
		</button>
		<button mat-icon-button id="menu-icon-manage" class="nav-button menu-icon"
			[class.active]="activeSection === 'manage'" routerLink="/manage" aria-label="Manage">
			<mat-icon [fontSet]="activeSection === 'manage' ? 'material-icons' : 'material-icons-outlined'">grid_view
			</mat-icon>
		</button>
		<!-- Target symptom: chip opening the symptom list (or the warning when there is none yet) -->
		<button *ngIf="symptoms.length === 0 else symptomMenuButton" id="menu-icon-target-symptom"
			class="symptom-chip menu-icon" aria-label="Symptoms" (click)="noSymptomWarning()">
			<mat-icon class="symptom-chip-icon">spa</mat-icon>
			<mat-icon class="symptom-chip-arrow">arrow_drop_down</mat-icon>
		</button>
		<ng-template #symptomMenuButton>
			<button id="menu-icon-target-symptom" class="symptom-chip menu-icon" [matMenuTriggerFor]="targetSymptom"
				aria-label="Symptoms">
				<mat-icon class="symptom-chip-icon">spa</mat-icon>
				<span class="targetSymptomKey">{{ globalService.symptomMap.get(getTargetSymptomKey()) }}</span>
				<mat-icon class="symptom-chip-arrow">arrow_drop_down</mat-icon>
			</button>
		</ng-template>
		<mat-menu #targetSymptom="matMenu">
			<button mat-menu-item *ngFor="let symptom of symptoms" [value]="symptom.key"
				(click)="globalService.targetSymptomKey = symptom.key">
				{{ symptom.label }}</button>
		</mat-menu>
		<!-- DEVELOPER UPDATES NOTIFICATION FEATURE DISABLED -->
		<!-- <button *ngIf="!globalService.hideDeveloperUpdates" mat-icon-button id="menu-icon-updates" class="menu-icon" (click)="openUpdates()" aria-label="Updates">
		<mat-icon [matBadge]="updatesCount > 0 ? updatesCount : null" matBadgeColor="warn">notifications</mat-icon>
	</button> -->
		<button mat-icon-button id="menu-icon-settings" class="nav-button menu-icon"
			[class.active]="activeSection === 'settings'" routerLink="/settings" aria-label="Settings">
			<mat-icon [fontSet]="activeSection === 'settings' ? 'material-icons' : 'material-icons-outlined'">settings
			</mat-icon>
		</button>
	</mat-toolbar>
</div>

<div class="content mat-typography">
	<router-outlet></router-outlet>
</div>
