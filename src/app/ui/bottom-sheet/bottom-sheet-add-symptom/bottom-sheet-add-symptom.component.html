<div class="bottom-sheet-container closable-sheet add-symptom">
    <button mat-icon-button class="sheet-close-button" (click)="onNoClick()" [attr.aria-label]="'CLOSE' | transloco">
        <mat-icon>close</mat-icon>
    </button>

    <div class="header-section">
        <h1 class="title">
            <span *ngIf="data.edit">{{ 'EDIT_SYMPTOM' | transloco }}</span>
            <span *ngIf="!data.edit">{{ 'ADD_SYMPTOM' | transloco }}</span>
        </h1>
    </div>

    <div class="content-body">
        <div class="form-field">
            <div class="field-label">{{ 'SYMPTOM' | transloco | titlecase }}</div>
            <div class="field-input-box">
                <mat-form-field appearance="none" class="clean-input">
                    <input matInput [(ngModel)]="data.symptom.label" cdkFocusInitial placeholder="Ex: Migraine">
                </mat-form-field>
            </div>
        </div>

        <div class="inverted-scale">
            <div class="inverted-scale-row">
                <div class="inverted-scale-text">
                    <span class="inverted-scale-label">{{ 'SYMPTOM_INVERTED_SCALE' | transloco }}</span>
                    <span class="inverted-scale-hint">{{ 'SYMPTOM_INVERTED_SCALE_HINT' | transloco }}</span>
                </div>
                <mat-slide-toggle [(ngModel)]="data.symptom.invertedScale" color="primary"
                    class="inverted-scale-toggle"></mat-slide-toggle>
            </div>
            <!-- Colors of the intensities, from 0 to the maximum -->
            <div class="scale-preview">
                <span class="scale-end">0</span>
                <span class="scale-colors">
                    <span *ngFor="let color of scaleColors" class="scale-color" [style.background-color]="color"></span>
                </span>
                <span class="scale-end">{{ painScale }}</span>
            </div>
        </div>
    </div>

    <div class="actions">
        <button mat-flat-button color="primary" (click)="onYesClick()" [disabled]="!data.symptom.label">
            <span *ngIf="data.edit">{{ 'EDIT' | transloco }}</span>
            <span *ngIf="!data.edit">{{ 'ADD' | transloco }}</span>
        </button>
    </div>

    <app-spacer-item></app-spacer-item>

</div>
