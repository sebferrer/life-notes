<ng-template transloco let-t>
    <div class="bottom-sheet-container closable-sheet delete-overview">
        <button mat-icon-button class="sheet-close-button v2-only" (click)="onCancel()"
            [attr.aria-label]="'CLOSE' | transloco">
            <mat-icon>close</mat-icon>
        </button>
        <div class="header-section">
            <h2 class="title">{{ t(data.title, data.params) }}</h2>
        </div>

        <div class="content-section">
            <p class="message" *ngFor="let line of data.content">{{ t(line, data.params) }}</p>
        </div>

        <div class="actions">
            <button mat-stroked-button (click)="onCancel()" class="cancel-button">
                {{ t('CANCEL') }}
            </button>
            <button mat-flat-button color="warn" (click)="onConfirm()" class="delete-button">
                {{ t('DELETE') }}
            </button>
        </div>

        <app-spacer-item></app-spacer-item>

    </div>
</ng-template>
