<ng-template transloco let-t>
    <div class="bottom-sheet-container closable-sheet delete-timeline-event">
        <button mat-icon-button class="sheet-close-button v2-only" (click)="onCancelClick()"
            [attr.aria-label]="'CLOSE' | transloco">
            <mat-icon>close</mat-icon>
        </button>
        <div class="header-section">
            <h2 class="title">{{ t('DELETE_EVENT_DIALOG_TITLE', { type: data.typeLabel || t(data.type) }) }}</h2>
        </div>

        <div class="content-body">
            <p>{{ t('DELETE_EVENT_DIALOG_CONTENT', { type: data.typeLabel || t(data.type), time: data.time, month:
                t('MONTH-'+data.detailedDate.month), day: data.detailedDate.day }) }}</p>
        </div>

        <div class="actions">
            <button mat-stroked-button (click)="onCancelClick()" class="cancel-button">
                {{ t('NO') }}
            </button>
            <button mat-flat-button color="primary" (click)="onConfirmClick()" class="confirm-button">
                {{ t('YES') }}
            </button>
        </div>

        <app-spacer-item></app-spacer-item>

    </div>
</ng-template>
