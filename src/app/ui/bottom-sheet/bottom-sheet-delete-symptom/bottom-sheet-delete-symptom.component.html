<div class="bottom-sheet-container closable-sheet delete-symptom">
    <button mat-icon-button class="sheet-close-button v2-only" (click)="onNoClick()"
        [attr.aria-label]="'CLOSE' | transloco">
        <mat-icon>close</mat-icon>
    </button>

    <div class="header-section">
        <h1 class="title">{{ 'DELETE_SYMPTOM_DIALOG_TITLE' | transloco: { symptom: data.label } }}</h1>
    </div>

    <div class="content-body">
        <p>{{ 'DELETE_SYMPTOM_DIALOG_CONTENT' | transloco: { symptom: data.label } }}</p>
    </div>

    <div class="actions">
        <button mat-stroked-button (click)="onNoClick()">
            {{ 'NO' | transloco }}
        </button>
        <button mat-flat-button color="warn" (click)="onYesClick()">
            {{ 'YES' | transloco }}
        </button>
    </div>

    <app-spacer-item></app-spacer-item>

</div>
