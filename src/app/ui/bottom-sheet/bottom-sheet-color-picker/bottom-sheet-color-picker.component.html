<ng-template transloco let-t>
    <div class="bottom-sheet-container closable-sheet color-picker-sheet">
        <button mat-icon-button class="sheet-close-button" (click)="onCancel()" [attr.aria-label]="t('CLOSE')">
            <mat-icon>close</mat-icon>
        </button>

        <div class="header-section">
            <div class="title-row">
                <div class="title-text">
                    <div class="overline">{{ t('COLOR_PICKER_TITLE') }}</div>
                    <div class="main-title">{{ t(data.title) }}</div>
                </div>
            </div>
        </div>

        <!-- Before / after, as drawn in the app. The color the sheet started from is one tap away. -->
        <div class="color-compare">
            <button type="button" class="compare-half compare-initial" [class.changed]="changed"
                [style.background-color]="initialColor" [style.color]="onColor(initialColor)" [disabled]="!changed"
                (click)="revert()">
                <mat-icon *ngIf="data.icon">{{ data.icon }}</mat-icon>
                <img *ngIf="data.svg" [src]="data.svg" [style.filter]="onFilter(initialColor)" alt="" />
                <span class="compare-label">{{ t('COLOR_PICKER_CURRENT') }}</span>
                <mat-icon *ngIf="changed" class="compare-undo">undo</mat-icon>
            </button>
            <div class="compare-half compare-new" [style.background-color]="color" [style.color]="onColor(color)">
                <mat-icon *ngIf="data.icon">{{ data.icon }}</mat-icon>
                <img *ngIf="data.svg" [src]="data.svg" [style.filter]="onFilter(color)" alt="" />
                <span class="compare-label">{{ t('COLOR_PICKER_NEW') }}</span>
            </div>
        </div>

        <app-color-picker [color]="color" [swatches]="data.swatches" (colorChange)="color = $event"></app-color-picker>

        <div class="actions">
            <button mat-stroked-button (click)="onCancel()" class="cancel-button">
                {{ t('CANCEL') }}
            </button>
            <button mat-flat-button color="primary" (click)="onConfirm()" class="confirm-button">
                {{ t('COLOR_PICKER_APPLY') }}
            </button>
        </div>

        <app-spacer-item></app-spacer-item>
    </div>
</ng-template>
