<div class="bottom-sheet-container closable-sheet import-confirm">
    <button mat-icon-button class="sheet-close-button v2-only" (click)="onNoClick()"
        [attr.aria-label]="'CLOSE' | transloco">
        <mat-icon>close</mat-icon>
    </button>
    <div class="header-section">
        <h2 class="title">{{ 'IMPORT_DIALOG_TITLE' | transloco }}</h2>
    </div>

    <div class="content-body">
        <p>{{ 'IMPORT_DIALOG_CONTENT_1' | transloco }}</p>
        <p>{{ 'IMPORT_DIALOG_CONTENT_2' | transloco }}</p>
        <p>{{ 'IMPORT_DIALOG_CONTENT_3' | transloco }}</p>
    </div>

    <div class="actions">
        <button mat-stroked-button (click)="onNoClick()" class="cancel-button">
            {{ 'NO' | transloco }}
        </button>
        <button mat-flat-button color="primary" (click)="onYesClick()" class="confirm-button">
            {{ 'YES' | transloco }}
        </button>
    </div>

    <app-spacer-item></app-spacer-item>

</div>
