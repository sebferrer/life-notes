<ng-template transloco let-t>
    <div class="bottom-sheet-container closable-sheet edit-log">
        <button mat-icon-button class="sheet-close-button" (click)="onCancel()" [attr.aria-label]="t('CLOSE')">
            <mat-icon>close</mat-icon>
        </button>
        <div class="header-section">
            <h2 class="title">{{ t(data.title || 'EDIT_LOG_TITLE') }}</h2>
        </div>

        <div class="content-section">
            <div class="field-container">
                <mat-form-field appearance="outline">
                    <mat-label>{{ t(data.label || 'TABLE_NOTE') }}</mat-label>
                    <input matInput [(ngModel)]="data.key" required>
                </mat-form-field>
            </div>

            <div class="warning-text">
                <p>{{ t(data.warning || 'EDIT_LOG_WARNING') }}</p>
            </div>
        </div>

        <div class="actions">
            <button mat-flat-button color="primary" (click)="onConfirm()" [disabled]="!isValid()"
                class="confirm-button">
                {{ t('EDIT') }}
            </button>
        </div>

        <app-spacer-item></app-spacer-item>

    </div>
</ng-template>
