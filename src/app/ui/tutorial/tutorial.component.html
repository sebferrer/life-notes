<div class="slideshow">
    <ion-slides>
        <ion-slide *ngFor="let slide of slides" [ngSwitch]="slide.label">
            <div *ngSwitchCase="'header'" class="slide">
                <div class="slide-text-header">
                    <h2>{{ slide.title | transloco }}</h2>
                    <p [innerHTML]="slide.text | transloco"></p>
                    <p>{{ 'TUTORIAL_SWIPE' | transloco }}</p>
                </div>
                <app-swiping-finger></app-swiping-finger>
            </div>
            <div *ngSwitchCase="'scene'" class="slide slide-scene">
                <app-tutorial-scene [scene]="slide.scene"></app-tutorial-scene>
                <div class="slide-text-scene">
                    <h2>{{ (classic && slide.classicTitle ? slide.classicTitle : slide.title) | transloco }}</h2>
                    <p [innerHTML]="(classic && slide.classicText ? slide.classicText : slide.text) | transloco"></p>
                </div>
            </div>
            <!-- No request to rate the app: the invitation of ReviewService does it once, as Google Play allows -->
            <div *ngSwitchCase="'contact'" class="slide">
                <div class="contact-icon">
                    <mat-icon>email</mat-icon>
                </div>
                <div class="slide-text-contact">
                    <h2>{{ slide.title | transloco }}</h2>
                    <p>{{ slide.text | transloco }}
                        <a href="mailto:{{ email }}">{{ email }}</a>
                    </p>
                </div>
            </div>
        </ion-slide>
    </ion-slides>
</div>
